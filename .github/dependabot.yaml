# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2
updates:
  - directory: /
    package-ecosystem: github-actions
    patterns:
      - '*'
    target-branch: main
    commit-message:
      include: scope
      prefix: '[Dependabot] '
    pull-request-branch-name:
      separator: /
    labels:
      - Dependency
    assignees:
      - glektarssza
    schedule:
      interval: weekly
      day: wednesday
      time: '12:00'
      timezone: Canada/Mountain
  - directories:
      - /
      - /app/
      - /packages/core/
      - /packages/logging/
    package-ecosystem: npm
    versioning-strategy: increase
    ignore:
      - dependency-name: typescript
        versions: '>=6.1.0'
    target-branch: main
    commit-message:
      include: scope
      prefix: '[Dependabot] '
    pull-request-branch-name:
      separator: /
    labels:
      - Dependency
    assignees:
      - glektarssza
    schedule:
      interval: weekly
      day: wednesday
      time: '12:00'
      timezone: Canada/Mountain
