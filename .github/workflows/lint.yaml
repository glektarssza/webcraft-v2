# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Lint
on:
  workflow_call:
    inputs:
      git-ref:
        description: |
          The Git reference from which to clone the project.

          This can be any valid Git commit-ish (e.g. a SHA, a ref, a tag, and so
          on).

          Defaults to the SHA that caused the workflow to be triggered. If that
          is unavailable the fully formed reference of the branch or tag that
          triggered the workflow is used. If that is unavailable the repository
          default branch is used.
        type: string
        required: false
        default: ${{github.sha || github.ref || github.event.repository.default_branch}}
      node-version:
        description: |
          The NodeJS version to use.

          Use "nvmrc" to use the value in the repository ".nvmrc" file.

          Defaults to "latest".
        type: string
        required: false
        default: latest
      package-manager:
        description: |
          The NodeJS package manager to use.

          Defaults to "pnpm".
        type: string
        required: false
        default: pnpm
      package-manager-version:
        description: |
          The NodeJS package manager version to use.

          Use "packageManifest" to use the value specified in the package
          manifest.

          Defaults to "latest".
        type: string
        required: false
        default: latest
    secrets:
      github-token:
        description: |
          The token to use to make authenticated calls to the GitHub API.
        required: false
env:
  GITHUB_TOKEN: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      # -- Needed to checkout the repository
      contents: read
    steps:
      - id: checkout-repository
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{inputs.git-ref}}
          lfs: true
          token: ${{env.GITHUB_TOKEN}}
      - id: setup-pnpm-package-manager-manifest
        name: Setup NodeJS Package Manager (Package Manifest)
        if: inputs.package-manager == 'pnpm' && inputs.package-manager-version == 'packageManifest'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ./package.json
          run_install: false
          standalone: false
          cache: true
          cache_dependency_path: ./pnpm-lock.yaml
      - id: setup-pnpm-package-manager-version
        name: Setup NodeJS Package (Version)
        if: inputs.package-manager == 'pnpm' && inputs.package-manager-version != 'packageManifest'
        uses: pnpm/action-setup@v6
        with:
          version: ${{inputs.package-manager-version}}
          run_install: false
          standalone: false
          cache: true
          cache_dependency_path: ./pnpm-lock.yaml
      - id: setup-nodejs-version
        name: Setup NodeJS (Version)
        if: inputs.node-version != 'nvmrc'
        uses: actions/setup-node@v7
        with:
          node-version: ${{inputs.node-version}}
          token: ${{env.GITHUB_TOKEN}}
      - id: setup-nodejs-nvmrc
        name: Setup NodeJS (.nvmrc)
        if: inputs.node-version == 'nvmrc'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          token: ${{env.GITHUB_TOKEN}}
      - id: install-dependencies
        name: Install dependencies
        run: pnpm -r install
      - id: lint
        name: Lint
        run: pnpm run lint
