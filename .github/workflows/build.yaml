# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build
on:
  workflow_call:
    inputs:
      git-ref:
        description: |
          The Git reference from which to clone the project.

          This can be any valid Git commit-ish (e.g. a SHA, a ref, a tag, and so
          on).

          Defaults to the SHA that caused the workflow to be triggered. If that
          is unavailable the fully formed reference of the branch or tag that
          triggered the workflow is used. If that is unavailable the repository
          default branch is used.
        type: string
        required: false
        default: ${{github.sha || github.ref || github.event.repository.default_branch}}
      build-type:
        description: |
          The type of build to make.

          Valid options are:
          * "development" for a development build.
          * "production" for a production build.
          * "dev" which is an alias for "development".
          * "prod" which is an alias for "production".

          Defaults to "production".
        type: string
        required: false
        default: production
      node-version:
        description: |
          The NodeJS version to use.

          Use "nvmrc" to use the value in the repository ".nvmrc" file.

          Defaults to "latest".
        type: string
        required: false
        default: latest
      package-manager:
        description: |
          The NodeJS package manager to use.

          Defaults to "pnpm".
        type: string
        required: false
        default: pnpm
      package-manager-version:
        description: |
          The NodeJS package manager version to use.

          Use "packageManifest" to use the value specified in the package
          manifest.

          Defaults to "latest".
        type: string
        required: false
        default: latest
      upload-artifacts:
        description: |
          Whether to upload build artifacts.

          Defaults to "false".
        type: boolean
        required: false
        default: false
      retention-days:
        description: |
          The number of days to retain built artifacts for.

          A value of "0" will use the repository default value.

          Defaults to "0".
        type: number
        required: false
        default: 0
    outputs:
      artifact-id:
        description: |
          The ID of the artifact generated by this workflow.
        value: ${{jobs.build.outputs.artifact-id}}
      artifact-name:
        description: |
          The name of the artifact generated by this workflow.
        value: ${{jobs.build.outputs.artifact-name}}
      artifact-url:
        description: |
          The download URL of the artifact generated by this workflow.
        value: ${{jobs.build.outputs.artifact-url}}
      artifact-digest:
        description: |
          The digest of the artifact generated by this workflow.
        value: ${{jobs.build.outputs.artifact-digest}}
    secrets:
      github-token:
        description: |
          The token to use to make authenticated calls to the GitHub API.
        required: false
env:
  GITHUB_TOKEN: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      # -- Needed to checkout the repository
      contents: read
    outputs:
      artifact-id: ${{steps.upload-artifacts.outputs.artifact-id}}
      artifact-name: dist-${{inputs.build-type}}
      artifact-url: ${{steps.upload-artifacts.outputs.artifact-url}}
      artifact-digest: ${{steps.upload-artifacts.outputs.artifact-digest}}
    steps:
      - id: clone-repository
        name: Clone repository
        uses: actions/checkout@v7
        with:
          ref: ${{inputs.git-ref}}
          lfs: true
          token: ${{env.GITHUB_TOKEN}}
      - id: setup-pnpm-package-manager-manifest
        name: Setup NodeJS Package Manager (Package Manifest)
        if: inputs.package-manager == 'pnpm' && inputs.package-manager-version == 'packageManifest'
        uses: pnpm/action-setup@v6
        with:
          package_json_file: ./package.json
          run_install: false
          standalone: false
          cache: true
          cache_dependency_path: ./pnpm-lock.yaml
      - id: setup-pnpm-package-manager-version
        name: Setup NodeJS Package (Version)
        if: inputs.package-manager == 'pnpm' && inputs.package-manager-version != 'packageManifest'
        uses: pnpm/action-setup@v6
        with:
          version: ${{inputs.package-manager-version}}
          run_install: false
          standalone: false
          cache: true
          cache_dependency_path: ./pnpm-lock.yaml
      - id: setup-nodejs-version
        name: Setup NodeJS (Version)
        if: inputs.node-version != 'nvmrc'
        uses: actions/setup-node@v7
        with:
          node-version: ${{inputs.node-version}}
          token: ${{env.GITHUB_TOKEN}}
      - id: setup-nodejs-nvmrc
        name: Setup NodeJS (.nvmrc)
        if: inputs.node-version == 'nvmrc'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          token: ${{env.GITHUB_TOKEN}}
      - id: install-dependencies
        name: Install dependencies
        run: pnpm -r install
      - id: determine-build-type
        name: Determine build type
        shell: bash
        env:
          BUILD_TYPE: ${{inputs.build-type}}
        run: |
          case "${BUILD_TYPE}" in
            prod*)
              echo "build-script=build:production" >> "${GITHUB_OUTPUT}";
            ;;
            dev*)
              echo "build-script=build:development" >> "${GITHUB_OUTPUT}";
            ;;
            *)
              echo "::error::Unknown build type \"${BUILD_TYPE}\"!";
              exit 1;
            ;;
          esac
      - id: build
        name: Build
        shell: bash
        env:
          BUILD_SCRIPT: ${{steps.determine-build-type.outputs.build-script}}
        run: |
          pnpm run "${BUILD_SCRIPT}";
      - id: upload-artifacts
        name: Upload artifacts
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v7
        with:
          path: ./app/dist/
          name: dist-${{inputs.build-type}}
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
          retention-days: ${{inputs.retention-days}}
